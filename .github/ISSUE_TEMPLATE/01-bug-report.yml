name: Bug report
description: Report a reproducible problem in a WorkplaceCloudHub tool or script.
title: "[Bug]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Remove all credentials, tenant identifiers,
        customer data, and other sensitive information before submitting.
  - type: input
    id: project_path
    attributes:
      label: Project or path
      description: Identify the affected project or repository path.
      placeholder: SmartM365/Devices/IntuneHybridJoinToolkit
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the application version, release, or Git commit if known.
      placeholder: v1.2.3 or a0d0b85
    validations:
      required: false
  - type: dropdown
    id: powershell_version
    attributes:
      label: PowerShell environment
      options:
        - Windows PowerShell 5.1
        - PowerShell 7.x
        - Both Windows PowerShell 5.1 and PowerShell 7.x
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Describe the operating system, relevant modules, and execution context.
      placeholder: Windows 11 24H2, PowerShell 7.5, delegated authentication
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error message when possible.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add relevant logs, screenshots, or output after removing sensitive data.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I read the README for the affected project.
          required: true
        - label: I removed secrets, tenant identifiers, and customer data.
          required: true
        - label: I agree to follow the repository Code of Conduct.
          required: true
